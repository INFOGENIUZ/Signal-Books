<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Ambient Gold Backlight Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBacklight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glowing Ribbon Gradients -->
    <linearGradient id="goldRibbonMain" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FFC000"/>
      <stop offset="60%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#C25000"/>
    </linearGradient>

    <linearGradient id="goldRibbonTopHighlight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="40%" stop-color="#FFDF66"/>
      <stop offset="80%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#B85000"/>
    </linearGradient>

    <linearGradient id="goldRibbonShadow" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#802F00"/>
      <stop offset="40%" stop-color="#B34B00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <!-- Book Pages Gold Gradient -->
    <linearGradient id="goldPageTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="45%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#D96800"/>
    </linearGradient>

    <linearGradient id="goldPageMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#A64400"/>
    </linearGradient>

    <linearGradient id="goldPageBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#5E2200"/>
    </linearGradient>

    <!-- Star Gradient -->
    <radialGradient id="goldStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </radialGradient>

    <!-- Typography Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE899"/>
      <stop offset="40%" stop-color="#FFC526"/>
      <stop offset="85%" stop-color="#FF8E00"/>
      <stop offset="100%" stop-color="#D46200"/>
    </linearGradient>
  </defs>

  <!-- Deep Black Background Canvas -->
  <rect width="800" height="800" fill="#070605" rx="32"/>

  <!-- Radial Background Backlight -->
  <circle cx="400" cy="275" r="190" fill="#FF8A00" opacity="0.18" filter="url(#softBacklight)" />
  <circle cx="400" cy="260" r="110" fill="#FFC000" opacity="0.14" filter="url(#softBacklight)" />

  <!-- EMBLEM GROUP (Center: 400, 275) -->
  <g id="logo-emblem" transform="translate(400, 290)">
    
    <!-- 1. OPEN BOOK WITH GLOWING PAGES -->
    <!-- Bottom Cover Border Base -->
    <path d="M 0,86 
             C -25,80 -80,88 -150,116 
             C -198,136 -216,146 -224,150 
             C -224,150 -185,116 -105,82 
             C -50,60 -18,66 0,72 
             C 18,66 50,60 105,82 
             C 185,116 224,150 224,150 
             C 216,146 198,136 150,116 
             C 80,88 25,80 0,86 Z" 
          fill="url(#goldPageBottom)" />

    <!-- Left Book Outer Fan Page (Leaf 1) -->
    <path d="M -6,76 
             C -38,64 -100,70 -168,98 
             C -196,110 -214,122 -214,122 
             C -214,122 -180,98 -115,74 
             C -68,57 -28,66 -6,76 Z" 
          fill="url(#goldPageMid)" />

    <!-- Left Book Top Fan Page (Leaf 2) -->
    <path d="M -8,72 
             C -45,55 -110,60 -180,88 
             C -198,96 -208,102 -208,102 
             C -208,102 -172,74 -110,54 
             C -65,40 -26,52 -8,72 Z" 
          fill="url(#goldPageTop)" />

    <!-- Right Book Outer Fan Page (Leaf 1) -->
    <path d="M 6,76 
             C 38,64 100,70 168,98 
             C 196,110 214,122 214,122 
             C 214,122 180,98 115,74 
             C 68,57 28,66 6,76 Z" 
          fill="url(#goldPageMid)" />

    <!-- Right Book Top Fan Page (Leaf 2) -->
    <path d="M 8,72 
             C 45,55 110,60 180,88 
             C 198,96 208,102 208,102 
             C 208,102 172,74 110,54 
             C 65,40 26,52 8,72 Z" 
          fill="url(#goldPageTop)" />

    <!-- Book Center Spine V-Contour Accent -->
    <path d="M 0,64 C -6,64 -12,72 -12,82 C -12,92 0,100 0,100 C 0,100 12,92 12,82 C 12,72 6,64 0,64 Z" fill="#FFE27A"/>

    <!-- 2. GLOWING 3D RIBBON "S" -->
    <!-- Ribbon Underside / Depth / Inner Shadow Turn -->
    <path d="M 0,68 
             C 20,46 54,12 62,-28 
             C 70,-72 45,-104 0,-118 
             C -58,-136 -122,-102 -132,-42 
             C -140,-2 -116,36 -58,66 
             C -34,77 -12,78 0,68 Z" 
          fill="url(#goldRibbonShadow)" />

    <!-- Ribbon Main Dynamic Body (Sweeping 3D S Curve) -->
    <path d="M -132,-42 
             C -144,-95 -100,-162 -16,-184 
             C 48,-200 112,-178 128,-125 
             C 136,-94 122,-66 85,-45 
             C 32,-14 10,18 22,50 
             C 28,64 14,72 0,76 
             C 14,48 30,16 2,-8 
             C -42,-42 -74,-58 -106,-78 
             C -124,-90 -132,-62 -132,-42 Z" 
          fill="url(#goldRibbonMain)" />

    <!-- Top Crown Curve Highlight Edge -->
    <path d="M -16,-184 
             C -70,-170 -112,-120 -122,-68 
             C -125,-88 -100,-146 -22,-172 
             C 42,-194 100,-172 116,-130 
             C 126,-104 116,-78 80,-56 
             C 112,-74 132,-104 125,-140 
             C 112,-180 54,-200 -16,-184 Z" 
          fill="url(#goldRibbonTopHighlight)" 
          filter="url(#goldGlow)" />

    <!-- 3. GLOWING 4-POINT DIAMOND STAR (Top Right) -->
    <g transform="translate(116, -165)" filter="url(#starGlow)">
      <!-- 4-point Star Geometry -->
      <path d="M 0,-28 
               C 1,-9 9,-1 28,0 
               C 9,1 1,9 0,28 
               C -1,9 -9,1 -28,0 
               C -9,-1 -1,-9 0,-28 Z" 
            fill="url(#goldStar)" />
    </g>
  </g>

  <!-- 4. TYPOGRAPHY: SIGNAL BOOKS -->
  <g id="typography" text-anchor="middle">
    <!-- "Signal Books" in Elegant High-Contrast Serif Style -->
    <text x="400" y="555" 
          font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="76" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="url(#goldTextGrad)"
          filter="url(#goldGlow)">
      Signal Books
    </text>

    <!-- Subtitle: — ONLINE LIBRARY — -->
    <g transform="translate(0, 608)">
      <!-- Left Divider Line -->
      <line x1="95" y1="0" x2="205" y2="0" stroke="#FFB700" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Text -->
      <text x="400" y="7" 
            font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
            font-size="20" 
            font-weight="700" 
            fill="#FFC933" 
            letter-spacing="8" 
            opacity="0.95">
        ONLINE LIBRARY
      </text>
      
      <!-- Right Divider Line -->
      <line x1="595" y1="0" x2="705" y2="0" stroke="#FFB700" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Tagline: Knowledge has no limits -->
    <text x="400" y="658" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="400" 
          fill="#E5C158" 
          letter-spacing="4" 
          opacity="0.9">
      Knowledge has no limits
    </text>
  </g>
</svg>
