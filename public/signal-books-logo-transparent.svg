<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 3D Ribbon S Primary Gradient -->
    <linearGradient id="tRibbonMain" x1="20%" y1="10%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#00A9FF"/>
      <stop offset="35%" stop-color="#0077D6"/>
      <stop offset="70%" stop-color="#004A99"/>
      <stop offset="100%" stop-color="#052857"/>
    </linearGradient>

    <!-- Top Ribbon Highlight -->
    <linearGradient id="tRibbonHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D6FF"/>
      <stop offset="50%" stop-color="#00A0F0"/>
      <stop offset="100%" stop-color="#0060B8"/>
    </linearGradient>

    <!-- Ribbon Turn / Inner Shadow -->
    <linearGradient id="tRibbonShadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021C42"/>
      <stop offset="60%" stop-color="#043270"/>
      <stop offset="100%" stop-color="#0058B3"/>
    </linearGradient>

    <!-- Book Base / Cover Gradient -->
    <linearGradient id="tBookCoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D2342"/>
      <stop offset="100%" stop-color="#051224"/>
    </linearGradient>

    <!-- Book Pages Light Gradient -->
    <linearGradient id="tBookPageLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Pixel Blocks Gradient -->
    <linearGradient id="tPixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tPixelGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM GROUP (Center ~ X: 400, Y: 310) -->
  <g transform="translate(400, 310)">
    <!-- Lower Wings (Dark Navy Cover) -->
    <path d="M 0,90 
             C -20,86 -70,92 -140,118 
             C -190,136 -210,146 -220,152 
             C -220,152 -180,115 -100,85 
             C -45,64 -15,70 0,76 
             C 15,70 45,64 100,85 
             C 180,115 220,152 220,152 
             C 210,146 190,136 140,118 
             C 70,92 20,86 0,90 Z" 
          fill="url(#tBookCoverGrad)" />

    <!-- Left Book Lower Page Leaf -->
    <path d="M -5,80 
             C -35,68 -90,75 -155,102 
             C -185,114 -205,126 -205,126 
             C -205,126 -175,102 -110,80 
             C -65,65 -25,72 -5,80 Z" 
          fill="#0369A1" opacity="0.95" />

    <!-- Left Book Main Open Page Leaf -->
    <path d="M -8,76 
             C -40,62 -100,68 -170,95 
             C -190,103 -200,108 -200,108 
             C -200,108 -165,82 -105,62 
             C -60,48 -25,58 -8,76 Z" 
          fill="url(#tBookPageLight)" />

    <!-- Right Book Lower Page Leaf -->
    <path d="M 5,80 
             C 35,68 90,75 155,102 
             C 185,114 205,126 205,126 
             C 205,126 175,102 110,80 
             C 65,65 25,72 5,80 Z" 
          fill="#0369A1" opacity="0.95" />

    <!-- Right Book Main Open Page Leaf -->
    <path d="M 8,76 
             C 40,62 100,68 170,95 
             C 190,103 200,108 200,108 
             C 200,108 165,82 105,62 
             C 60,48 25,58 8,76 Z" 
          fill="url(#tBookPageLight)" />

    <!-- Center Book Spine Crease Anchor -->
    <path d="M 0,68 C -6,68 -10,75 -10,85 C -10,95 0,102 0,102 C 0,102 10,95 10,85 C 10,75 6,68 0,68 Z" fill="#02152E"/>

    <!-- S Ribbon Bottom Curve (Rises up from Book Spine) -->
    <path d="M 0,72 
             C 18,50 48,15 56,-25 
             C 64,-65 42,-95 0,-108 
             C -55,-125 -115,-95 -125,-40 
             C -133,-2 -110,35 -55,62 
             C -32,73 -12,76 0,72 Z" 
          fill="url(#tRibbonShadow)" />

    <!-- S Main Dynamic Body (Sweeping Ribbon Loop) -->
    <path d="M -125,-40 
             C -135,-90 -95,-155 -15,-175 
             C 45,-190 105,-170 120,-120 
             C 128,-90 115,-65 80,-45 
             C 30,-15 8,15 20,45 
             C 25,60 12,68 0,72 
             C 12,45 28,15 0,-8 
             C -40,-40 -70,-55 -100,-75 
             C -118,-87 -125,-60 -125,-40 Z" 
          fill="url(#tRibbonMain)" />

    <!-- S Top Loop Crown with Gloss / Light Edge -->
    <path d="M -15,-175 
             C -65,-162 -105,-115 -115,-65 
             C -118,-85 -95,-140 -20,-165 
             C 40,-185 95,-165 110,-125 
             C 120,-100 110,-75 75,-55 
             C 105,-72 125,-100 118,-135 
             C 105,-172 50,-190 -15,-175 Z" 
          fill="url(#tRibbonHighlight)" />

    <!-- S Upper Horizontal Bar -->
    <path d="M -15,-175 L 68,-175 C 80,-175 80,-155 68,-155 L -30,-155 C -25,-165 -20,-172 -15,-175 Z" fill="url(#tPixelGradLight)" />

    <!-- Digital Pixels / Cubes -->
    <rect x="68" y="-178" width="32" height="32" rx="4" fill="url(#tPixelGrad)" />
    <rect x="112" y="-195" width="28" height="28" rx="4" fill="url(#tPixelGradLight)" />
    <rect x="64" y="-136" width="24" height="24" rx="3.5" fill="url(#tPixelGrad)" />
    <rect x="148" y="-180" width="20" height="20" rx="3" fill="url(#tPixelGradLight)" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="565" font-size="74" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#0C1D36">Signal </tspan>
      <tspan fill="#008DDA">Books</tspan>
    </text>
    <line x1="160" y1="620" x2="255" y2="620" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <text x="400" y="627" font-size="21" font-weight="700" fill="#0F172A" letter-spacing="7">ONLINE LIBRARY</text>
    <line x1="545" y1="620" x2="640" y2="620" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <text x="400" y="675" font-size="22" font-weight="500" fill="#475569" letter-spacing="1.5">Knowledge has no limits</text>
  </g>
</svg>
