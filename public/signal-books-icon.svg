<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="iGoldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="iGoldRibbonMain" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FFC000"/>
      <stop offset="60%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#C25000"/>
    </linearGradient>

    <linearGradient id="iGoldRibbonTopHighlight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="40%" stop-color="#FFDF66"/>
      <stop offset="80%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#B85000"/>
    </linearGradient>

    <linearGradient id="iGoldRibbonShadow" x1="85%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#802F00"/>
      <stop offset="40%" stop-color="#B34B00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <linearGradient id="iGoldPageTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="45%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#D96800"/>
    </linearGradient>

    <linearGradient id="iGoldPageMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#A64400"/>
    </linearGradient>

    <linearGradient id="iGoldPageBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#5E2200"/>
    </linearGradient>

    <radialGradient id="iGoldStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" rx="110" fill="#0C0A08"/>
  <circle cx="250" cy="245" r="140" fill="#FF9A00" opacity="0.15" filter="url(#iGoldGlow)"/>

  <g transform="translate(250, 260) scale(0.95)">
    <!-- Book Base / Cover -->
    <path d="M 0,86 C -25,80 -80,88 -150,116 C -198,136 -216,146 -224,150 C -224,150 -185,116 -105,82 C -50,60 -18,66 0,72 C 18,66 50,60 105,82 C 185,116 224,150 224,150 C 216,146 198,136 150,116 C 80,88 25,80 0,86 Z" fill="url(#iGoldPageBottom)" />

    <!-- Left Book Pages -->
    <path d="M -6,76 C -38,64 -100,70 -168,98 C -196,110 -214,122 -214,122 C -214,122 -180,98 -115,74 C -68,57 -28,66 -6,76 Z" fill="url(#iGoldPageMid)" />
    <path d="M -8,72 C -45,55 -110,60 -180,88 C -198,96 -208,102 -208,102 C -208,102 -172,74 -110,54 C -65,40 -26,52 -8,72 Z" fill="url(#iGoldPageTop)" />

    <!-- Right Book Pages -->
    <path d="M 6,76 C 38,64 100,70 168,98 C 196,110 214,122 214,122 C 214,122 180,98 115,74 C 68,57 28,66 6,76 Z" fill="url(#iGoldPageMid)" />
    <path d="M 8,72 C 45,55 110,60 180,88 C 198,96 208,102 208,102 C 208,102 172,74 110,54 C 65,40 26,52 8,72 Z" fill="url(#iGoldPageTop)" />

    <!-- Spine Accent -->
    <path d="M 0,64 C -6,64 -12,72 -12,82 C -12,92 0,100 0,100 C 0,100 12,92 12,82 C 12,72 6,64 0,64 Z" fill="#FFE27A"/>

    <!-- Ribbon S Depth -->
    <path d="M 0,68 C 20,46 54,12 62,-28 C 70,-72 45,-104 0,-118 C -58,-136 -122,-102 -132,-42 C -140,-2 -116,36 -58,66 C -34,77 -12,78 0,68 Z" fill="url(#iGoldRibbonShadow)" />

    <!-- Ribbon S Body -->
    <path d="M -132,-42 C -144,-95 -100,-162 -16,-184 C 48,-200 112,-178 128,-125 C 136,-94 122,-66 85,-45 C 32,-14 10,18 22,50 C 28,64 14,72 0,76 C 14,48 30,16 2,-8 C -42,-42 -74,-58 -106,-78 C -124,-90 -132,-62 -132,-42 Z" fill="url(#iGoldRibbonMain)" />

    <!-- Ribbon S Top Highlight with Glow -->
    <path d="M -16,-184 C -70,-170 -112,-120 -122,-68 C -125,-88 -100,-146 -22,-172 C 42,-194 100,-172 116,-130 C 126,-104 116,-78 80,-56 C 112,-74 132,-104 125,-140 C 112,-180 54,-200 -16,-184 Z" fill="url(#iGoldRibbonTopHighlight)" filter="url(#iGoldGlow)" />

    <!-- Glowing Star -->
    <g transform="translate(116, -165)">
      <path d="M 0,-30 C 1,-10 10,-1 30,0 C 10,1 1,10 0,30 C -1,10 -10,1 -30,0 C -10,-1 -1,-10 0,-30 Z" fill="url(#iGoldStar)" filter="url(#iGoldGlow)" />
    </g>
  </g>
</svg>
